documentation:
  country: TH
  description: First public EEG dataset explicitly targeting sit-to-stand and stand-to-sit transitions during motor execution
    and motor imagery, from 22 healthy participants with 60-channel EEG, EOG and EMG.
  doi: 10.5281/zenodo.20348444
  institution: Vidyasirimedhi Institute of Science and Technology
  investigators:
  - Benjakarn Uengsawapak
  - Supavit Kongwudhikunakorn
  - Suktipol Kiatthaveephong
  - Wipamas Polpakdee
  - Rattanaphon Chaisaen
  - Poramate Manoonpong
  - Chanitsada Chuenchit
  - Gun Bhakdisongkhram
  - Theerawit Wilaiprasitporn
  license: CC0-1.0
  publication_year: 2025
  repository: Zenodo
experiment:
  class_labels:
  - sit_stand
  - stand_sit
  events:
    sit_stand: 21
    stand_sit: 32
  mode: offline
  n_classes: 2
  paradigm: imagery
  study_design: 'Sit-to-stand and stand-to-sit transitions performed under both motor execution and motor imagery conditions;
    trigger codes at channel 63 mark each transition/rest event. MI: two rounds of 10 trials per task per session (readme
    index table).'
  trial_duration: 4.0
  trials_per_class:
    sit_stand: 20
    stand_sit: 20
